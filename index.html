<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das Mondtal – Spanisch für Madrid</title>
<meta name="description" content="Spanisch für den Umzug nach Madrid: ein Lernjahr in zwölf Regionen. Offline, ohne Konto, ohne Tracker.">
<meta name="theme-color" content="#05070f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mondtal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-64.png" sizes="64x64">
<style>
:root{
  --noche:#05070f; --noche2:#0d1220; --panel:#151d30; --panel2:#1e2740; --linie:rgba(255,255,255,.11);
  --crema:#ffffff; --crema2:#8a97b4; --farol:#ffb703; --naranja:#ff7d00; --musgo:#7bd88f; --cielo:#79c6d2; --rosa:#ff9ec7;
  --alarma:#ffab93;
  --display:Georgia,"Iowan Old Style","Times New Roman",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  --r:18px; --sp:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 60% at 80% -10%, #1a1a2e 0%, transparent 62%),
    radial-gradient(100% 50% at 0% 0%, #171126 0%, transparent 58%),
    var(--noche);
  color:var(--crema); font-family:var(--body); font-size:17px; line-height:1.55;
  -webkit-text-size-adjust:100%; min-height:100vh;
}
.stars{position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0}
.app{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:20px 16px 108px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;margin:0 0 8px}
h1{font-size:1.55rem;letter-spacing:.01em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0 0 12px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--farol);margin:0 0 6px}
.muted{color:var(--crema2)}
.small{font-size:.88rem}
button{font-family:inherit;font-size:1rem;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--farol);outline-offset:3px;border-radius:6px}
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--noche2) 100%);border:1px solid var(--linie);border-radius:var(--r);padding:18px;margin-bottom:14px}
.cifra{font-family:var(--display);font-size:2.5rem;line-height:1;color:var(--farol);font-weight:600}
.rotulo{font-size:.7rem;letter-spacing:.05em;color:var(--crema2)}
.kachel{background:var(--panel2);border:1px solid var(--linie);border-radius:14px;padding:12px 8px;text-align:center}
.kachel b{display:block;font-family:var(--display);font-size:1.4rem;color:var(--crema)}
.logros{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.logro{text-align:center;padding:10px 6px;border:1px solid var(--linie);border-radius:14px;background:var(--panel)}
.logro.off{opacity:.34}
.logro span{display:block;font-size:.68rem;color:var(--crema2);margin-top:5px;line-height:1.25}
#aviso{position:fixed;left:50%;top:12px;z-index:30;transform:translate(-50%,-150px);display:flex;align-items:center;gap:12px;
 background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--farol);border-radius:16px;padding:11px 16px;
 box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.34,1.56,.64,1);max-width:92vw}
#aviso.on{transform:translate(-50%,0)}
#aviso .t{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--farol)}
#aviso .n{font-family:var(--display);font-size:1.05rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border-radius:14px;background:linear-gradient(135deg,var(--farol),var(--naranja));color:#20160a;font-weight:700;border:none;width:100%}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:transparent;color:var(--crema);border:1px solid var(--linie)}
.btn.sec:hover{background:var(--panel2);filter:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.pill{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--linie);color:var(--crema2)}
.pill.g{color:var(--cielo);border-color:#2f5f6d}
.pill.t{color:var(--musgo);border-color:#37613a}

/* Kopf */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.moon{width:56px;height:56px;flex:0 0 56px}
.topmeta{flex:1;min-width:0}
.stat{display:flex;gap:14px;font-family:var(--mono);font-size:.78rem;color:var(--crema2)}
.stat b{color:var(--crema);font-weight:600}
.xpbar{height:8px;background:#0b141c;border:1px solid var(--linie);border-radius:99px;overflow:hidden;margin-top:8px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--musgo),var(--farol))}

/* Laternenpfad */
.path{position:relative;margin:6px 0 0;padding:0;list-style:none}
.path::before{content:"";position:absolute;left:37px;top:26px;bottom:26px;width:2px;background:repeating-linear-gradient(180deg,var(--linie) 0 6px,transparent 6px 14px)}
.station{position:relative;display:flex;gap:14px;align-items:flex-start;padding:10px 0}
.disco,.lantern{border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffffff 0%,#f6f1e4 62%,#ded6c2 100%);display:grid;place-items:center}
.lantern{position:relative;z-index:1;width:62px;height:62px;flex:0 0 62px;border:2px solid var(--linie)}
.disco{width:58px;height:58px;border:2px solid var(--linie)}
.disco.grande{width:84px;height:84px;flex:0 0 84px}
.disco.grande svg{width:68px;height:68px}
.globo{position:relative;background:#f6f1e4;color:#1b2b3a;padding:9px 14px;border-radius:16px;font-family:var(--display);font-size:1.15rem;font-weight:600;align-self:center}
.globo::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#f6f1e4}
.station.on .lantern{border-color:var(--farol);box-shadow:0 0 0 4px rgba(242,180,92,.13),0 0 26px rgba(242,180,92,.30);animation:glow 4s ease-in-out infinite}
.station.done .lantern{border-color:var(--musgo)}
.station.lock .lantern{opacity:.34;filter:grayscale(.6)}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px rgba(242,180,92,.10),0 0 20px rgba(242,180,92,.22)}50%{box-shadow:0 0 0 5px rgba(242,180,92,.18),0 0 34px rgba(242,180,92,.40)}}
.stinfo{flex:1;min-width:0;text-align:left}
.stinfo h3{margin:2px 0 2px}
.stbar{display:flex;gap:3px;margin-top:6px}
.stbar i{width:22px;height:5px;border-radius:9px;background:#0b141c;border:1px solid var(--linie)}
.stbar i.f{background:var(--farol);border-color:var(--farol)}

/* Dialog / Lernkarten */
.line{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid rgba(44,74,96,.5)}
.line:last-child{border-bottom:none}
.who{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.75rem;background:var(--panel2);border:1px solid var(--linie)}
.es{font-size:1.06rem}
.de{color:var(--crema2);font-size:.92rem;margin-top:2px}
.hidden{display:none}
.vocab{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:8px 0}
.vocab div{padding:7px 0;border-bottom:1px solid rgba(44,74,96,.45);font-size:.98rem}
.vocab div span{display:block;color:var(--crema2);font-size:.86rem}

/* Übungen */
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:14px;border:1px solid var(--linie);background:var(--panel);min-height:52px}
.opt:hover{background:var(--panel2)}
.opt.ok{border-color:var(--musgo);background:#17281d}
.opt.no{border-color:var(--alarma);background:#2a1a18}
.opt.dim{opacity:.55}
input[type=text],textarea{width:100%;min-height:52px;padding:13px 15px;border-radius:14px;border:1px solid var(--linie);background:#0b141c;color:var(--crema);font-family:var(--body);font-size:1.05rem}
textarea{min-height:120px;font-family:var(--mono);font-size:.8rem}
.feedback{margin-top:12px;padding:13px 15px;border-radius:14px;border:1px solid var(--linie);background:var(--noche2)}
.feedback.ok{border-color:var(--musgo)}
.feedback.no{border-color:var(--alarma)}
.progressdots{display:flex;gap:5px;margin-bottom:14px}
.progressdots i{flex:1;height:5px;border-radius:9px;background:#0b141c;border:1px solid var(--linie)}
.progressdots i.f{background:var(--cielo);border-color:var(--cielo)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:10px 14px;border-radius:12px;border:1px solid var(--linie);background:var(--panel);min-height:44px}
.chip.used{opacity:.35}

/* Nachschlagen */
.acc{border:1px solid var(--linie);border-radius:14px;margin-bottom:10px;overflow:hidden;background:var(--panel)}
.acc>button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;text-align:left;min-height:52px}
.acc .body{padding:0 16px 16px;border-top:1px solid var(--linie)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:11px 6px;border-radius:12px;border:1px solid var(--linie);font-size:.9rem;min-height:46px}
.tabs button[aria-selected=true]{background:var(--panel2);border-color:var(--farol);color:var(--crema)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td{padding:7px 0;border-bottom:1px solid rgba(44,74,96,.45);vertical-align:top}
td:first-child{color:var(--crema);padding-right:12px}
td:last-child{color:var(--crema2)}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(10,18,25,.95);border-top:1px solid var(--linie);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.navin{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;min-height:56px;font-size:.66rem;color:var(--crema2);border-radius:12px}
nav button[aria-current=page]{color:var(--farol)}
nav svg{width:23px;height:23px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.teclas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.teclas button{min-width:46px;min-height:46px;border:1px solid var(--linie);border-radius:11px;background:var(--panel);font-size:1.1rem}
.teclas button:hover{background:var(--panel2)}
.banner{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--linie);margin-bottom:14px;line-height:0}
.banner::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,16,23,.12) 0%,rgba(8,16,23,.10) 55%,rgba(8,16,23,.62) 100%)}
.banner img{width:100%;height:auto;display:block}
.banner .lamp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner svg{width:100%;height:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:620px){body{font-size:18px}}
</style>
</head>

const GRAMMAR=[
{id:"g1",ref:"Phase 1 · Überleben",m:1,t:"ser, estar, hay",k:"Drei Wege, „sein“ zu sagen.",r:["ser = Identität, Beruf, Herkunft, Eigenschaft: Soy Katrin. Soy alemana.","estar = Ort und Zustand: Estoy en Madrid. Estoy cansada.","hay = es gibt (unveränderlich): Hay una farmacia aquí."],e:["Soy profesora, pero ahora estoy de baja.|Ich bin Lehrerin, aber ich bin gerade krankgeschrieben.","¿Hay wifi? – Sí, pero está lento.|Gibt es WLAN? – Ja, aber es ist langsam."]},
{id:"g2",ref:"Phase 1 · Überleben",m:1,t:"Artikel & Genus",k:"Jedes Substantiv hat ein Geschlecht – lerne es mit.",r:["el / la (bestimmt), un / una (unbestimmt)","-o meist männlich, -a meist weiblich; -ción, -dad immer weiblich","Ausnahmen mitlernen: el día, la mano, el problema"],e:["el piso, la casa, la habitación, el problema|die Wohnung, das Haus, das Zimmer, das Problem"]},
{id:"g3",ref:"Phase 1 · Überleben",m:2,t:"Plural",k:"Vokal + s, Konsonant + es.",r:["la calle → las calles; el señor → los señores","-z wird zu -ces: el lápiz → los lápices","Artikel wird mit: los / las"],e:["Necesito dos billetes y tres bolsas.|Ich brauche zwei Tickets und drei Tüten."]},
{id:"g4",ref:"Phase 1 · Überleben",m:1,t:"Präsens auf -ar & Pronomen",k:"Die Endung sagt, wer handelt – Pronomen sind meist überflüssig.",r:["hablar: hablo, hablas, habla, hablamos, habláis, hablan","usted nimmt die Form von él/ella: ¿Usted habla alemán?","In Spanien ist tú unter Erwachsenen sehr üblich, bei Behörden usted."],e:["Trabajo en Madrid y estudio español.|Ich arbeite in Madrid und lerne Spanisch."]},
{id:"g5",ref:"Phase 1 · Überleben",m:2,t:"Präsens auf -er / -ir",k:"Fast dieselben Endungen wie -ar.",r:["comer: como, comes, come, comemos, coméis, comen","vivir: vivo, vives, vive, vivimos, vivís, viven","Nur wir/ihr unterscheiden -er und -ir."],e:["Vivo en Chamberí y como en la oficina.|Ich wohne in Chamberí und esse im Büro."]},
{id:"g6",ref:"Phase 1 · Überleben",m:2,t:"Fragen stellen",k:"Fragewort + Verb; Akzent nicht vergessen.",r:["qué, quién, dónde, cuándo, cómo, cuánto, por qué","Ohne Fragewort reicht die Intonation: ¿Tiene pan?","Umgekehrtes ¿ am Anfang."],e:["¿Dónde está la caja? ¿Cuánto cuesta?|Wo ist die Kasse? Was kostet das?"]},
{id:"g7",ref:"Phase 2 · Selbstständig werden",m:4,t:"Verneinung",k:"no steht direkt vor dem Verb.",r:["No entiendo. No hay billetes.","Doppelte Verneinung ist korrekt: No hay nada. No viene nunca.","tampoco = auch nicht"],e:["No funciona nada y el casero no contesta nunca.|Nichts funktioniert und der Vermieter geht nie ran."]},
{id:"g8",ref:"Phase 1 · Überleben",m:3,t:"tener, poder, querer, ir",k:"Die vier Verben, die im Alltag alles tragen.",r:["tener: tengo, tienes, tiene… (tener que + Infinitiv = müssen)","poder: puedo, puedes, puede… (Bitten, Erlaubnis)","querer: quiero, quieres, quiere… / ir: voy, vas, va…"],e:["Tengo que ir al ayuntamiento, ¿puede ayudarme?|Ich muss zum Rathaus, können Sie mir helfen?"]},
{id:"g9",ref:"Phase 2 · Selbstständig werden",m:3,t:"gustar & doler",k:"Nicht ich mag es, sondern: es gefällt mir.",r:["me / te / le / nos / os / les + gusta (Singular) oder gustan (Plural)","Genauso: doler (me duele la cabeza), apetecer, parecer, encantar","Person mit a betonen: A mí me gusta."],e:["Me gustan las tapas, pero me duele el estómago.|Ich mag Tapas, aber mein Magen tut weh."]},
{id:"g10",ref:"Phase 2 · Selbstständig werden",m:5,t:"Possessivbegleiter",k:"mi, tu, su … richten sich nach dem Ding, nicht nach der Person.",r:["mi / tu / su / nuestro / vuestro / su","Plural: mis llaves, sus hijos","su = sein, ihr und Ihr – im Zweifel: de él, de ella, de usted"],e:["Mi piso, tus llaves, su contrato.|Meine Wohnung, deine Schlüssel, sein Vertrag."]},
{id:"g11",ref:"Phase 1 · Überleben",m:2,t:"Zahlen, Uhrzeit, Datum",k:"Alles, was auf Terminzetteln steht.",r:["Uhrzeit mit son las: Son las diez y media. Ausnahme: Es la una.","a las diez = um zehn; de la mañana / de la tarde","Datum: el 3 de marzo de 2027"],e:["La cita es el lunes a las nueve menos cuarto.|Der Termin ist Montag um Viertel vor neun."]},
{id:"g12",ref:"Phase 2 · Selbstständig werden",m:4,t:"Präpositionen a, de, en, con, por, para",k:"Die häufigsten Fehlerquellen auf einen Blick.",r:["a = Richtung, Uhrzeit, Person als Objekt (Veo a mi vecina)","de = Herkunft, Besitz, Material; en = Ort, Verkehrsmittel","por = Grund/Weg, para = Ziel/Zweck: Estoy aquí por trabajo, para dos años."],e:["Voy a la oficina en metro para una reunión.|Ich fahre mit der Metro ins Büro zu einem Meeting."]},
{id:"g13",ref:"Phase 2 · Selbstständig werden",m:5,t:"estar + Gerundio",k:"Was gerade läuft.",r:["estar + -ando (-ar) / -iendo (-er, -ir)","Estoy buscando piso. Está lloviendo.","Nicht für Zukunft benutzen – dafür ir a + Infinitiv."],e:["Estamos buscando un piso amueblado.|Wir suchen gerade eine möblierte Wohnung."]},
{id:"g14",ref:"Phase 2 · Selbstständig werden",m:5,t:"Objektpronomen lo, la, le, me, te",k:"Kurze Wörter, die Wiederholung sparen.",r:["Direkt: me, te, lo/la, nos, os, los/las","Indirekt: me, te, le, nos, os, les","Vor dem konjugierten Verb oder angehängt an Infinitiv: ¿Me lo puede arreglar? / ¿Puede arreglármelo?"],e:["¿La cuenta? Me la trae, por favor.|Die Rechnung? Bringen Sie sie mir bitte."]},
{id:"g15",ref:"Phase 2 · Selbstständig werden",m:6,t:"ir a + Infinitiv (Zukunft)",k:"Die Zukunft, die man wirklich spricht.",r:["voy a, vas a, va a … + Infinitiv","Voy a pedir cita. Vamos a mudarnos en julio.","Das Futur auf -é ist meist Vermutung: Serán las diez."],e:["Mañana voy a llevar los papeles al ayuntamiento.|Morgen bringe ich die Papiere zum Rathaus."]},
{id:"g16",ref:"Phase 2 · Selbstständig werden",m:7,t:"Reflexive Verben & Tagesablauf",k:"me levanto, te llamas, se adapta.",r:["me / te / se / nos / os / se vor dem Verb","llamarse, levantarse, ducharse, acostarse, adaptarse, encontrarse","Mit Infinitiv angehängt: Voy a levantarme temprano."],e:["Me levanto a las siete y los niños se van al colegio a las nueve.|Ich stehe um sieben auf und die Kinder gehen um neun zur Schule."]},
{id:"g17",ref:"Phase 3 · In Madrid leben",m:11,t:"Indefinido – abgeschlossene Ereignisse",k:"Was gestern, letzte Woche, im Mai passierte.",r:["-ar: hablé, hablaste, habló, hablamos, hablasteis, hablaron","-er/-ir: comí, comiste, comió, comimos, comisteis, comieron","Wichtig unregelmäßig: fui (ser/ir), estuve, tuve, hice, dije"],e:["Ayer fui al médico y me hizo un análisis.|Gestern war ich beim Arzt und er hat mir eine Untersuchung gemacht."]},
{id:"g18",ref:"Phase 3 · In Madrid leben",m:11,t:"Imperfecto – Zustände und Gewohnheiten",k:"Wie es früher war, wie es aussah.",r:["-ar: hablaba, hablabas, hablaba…; -er/-ir: comía, comías, comía…","Nur drei unregelmäßig: era, iba, veía","Kontrast: Estaba en la calle cuando me llamó el jefe."],e:["Antes trabajaba en Colonia y no hablaba español.|Früher arbeitete ich in Köln und sprach kein Spanisch."]},
{id:"g19",ref:"Phase 2 · Selbstständig werden",m:9,t:"Pretérito perfecto – he hecho",k:"In Madrid das Alltagsvergangenheitstempus für heute.",r:["haber (he, has, ha, hemos, habéis, han) + Partizip","Partizip: hablado, comido, vivido; unregelmäßig: hecho, dicho, visto, escrito","Signalwörter: hoy, esta semana, ya, todavía no"],e:["Hoy he hablado con el cliente, pero todavía no he enviado el informe.|Heute habe ich mit dem Kunden gesprochen, aber den Bericht noch nicht geschickt."]},
{id:"g20",ref:"Phase 2 · Selbstständig werden",m:6,t:"Bitten & Imperativ (usted)",k:"Höflich etwas verlangen.",r:["usted: -e bei -ar (Firme aquí), -a bei -er/-ir (Escriba aquí)","Höflicher mit Frage: ¿Puede firmar aquí, por favor?","tú-Formen: firma, escribe, ven, dime"],e:["Rellene el formulario y firme abajo, por favor.|Füllen Sie das Formular aus und unterschreiben Sie unten, bitte."]},
{id:"g21",ref:"Phase 3 · In Madrid leben",m:9,t:"Konditional der Höflichkeit",k:"querría, podría, sería – öffnet in Spanien jede Tür.",r:["Infinitiv + ía: querría, podría, gustaría, sería","Me gustaría …, ¿Podría …?, Querría …","Deutlich weicher als quiero / puede."],e:["Me gustaría cambiar la cita. ¿Podría ser el jueves?|Ich würde gern den Termin verschieben. Ginge Donnerstag?"]},
{id:"g22",ref:"Phase 3 · In Madrid leben",m:9,t:"Vergleichen",k:"más que, menos que, tan como.",r:["más / menos + Adjektiv + que","tan + Adjektiv + como (gleich)","Unregelmäßig: mejor, peor, mayor, menor"],e:["Este piso es más caro que el otro, pero está mejor situado.|Diese Wohnung ist teurer als die andere, liegt aber besser."]},
{id:"g23",ref:"Phase 4 · Selbstständiges B1",m:12,t:"Subjuntivo – der Einstieg",k:"Nach Wunsch, Bewertung und Zukunftsbezug mit cuando.",r:["Bildung: 1. Person Präsens, Endung tauschen: hablo → hable, como → coma","Auslöser: quiero que, es necesario que, espero que, cuando + Zukunft","Kein Subjuntivo, wenn beide Sätze dasselbe Subjekt haben: Quiero ir."],e:["Es necesario que traiga el pasaporte. Cuando llegue, la llamo.|Sie müssen den Pass mitbringen. Wenn ich ankomme, rufe ich sie an."]},
{id:"g24",ref:"Phase 3 · In Madrid leben",m:10,t:"Verknüpfen & Gesprächsmarker",k:"Damit Sätze zu Gesprächen werden.",r:["porque, por eso, así que, aunque, además, sin embargo","Gesprächsmarker: pues, bueno, es que, o sea, por cierto, la verdad es que","Zustimmen: claro, vale, exacto, desde luego"],e:["Bueno, es que hoy no puedo, pero podríamos quedar el sábado.|Also, heute geht es nämlich nicht, aber wir könnten Samstag ausmachen."]},
{id:"g25",ref:"Phase 2 · Selbstständig werden",m:5,t:"Zwei Pronomen im Satz: se lo, me lo",k:"Der Satz, mit dem man in Madrid alles regelt.",r:["Reihenfolge: erst indirekt, dann direkt – me lo, te lo, nos lo","le/les wird vor lo/la zu se: Se lo digo mañana.","An Infinitiv oder Gerundio angehängt: ¿Puede arreglármelo?"],e:["¿Me lo puede mandar por correo? – Sí, se lo mando hoy.|Können Sie es mir per Mail schicken? – Ja, ich schicke es Ihnen heute."]},
{id:"g26",ref:"Phase 2 · Selbstständig werden",m:6,t:"hay que, tener que, se puede",k:"Notwendigkeit unpersönlich ausdrücken.",r:["hay que + Infinitiv = man muss (allgemein)","tener que + Infinitiv = ich/du/Sie muss konkret","¿Se puede …? = Darf man …?"],e:["Hay que pedir cita por internet, no se puede venir sin cita.|Man muss online einen Termin buchen, ohne Termin kann man nicht kommen."]},
{id:"g27",ref:"Phase 4 · Selbstständiges B1",m:9,t:"Höflichkeitsformeln",k:"Vier Wendungen, die jede Bitte weich machen.",r:["quería / querría + Substantiv: Quería una cita.","¿Sería posible …? / ¿Le importaría …?","¿Me podría …? statt ¿Me puede …? bei heiklen Bitten","Perdone que le moleste – Entschuldigen Sie die Störung"],e:["Perdone que le moleste, ¿sería posible cambiar la cita?|Entschuldigen Sie die Störung, wäre es möglich, den Termin zu ändern?"]}
];

{id:"m1",par:["Stell dich deinem Partner vor: nombre, origen, motivo - drei Sätze.","Frag ihn: ¿Y tú, de dónde eres? und antworte auf seine Rückfrage.","Er spielt Pilar, du klingelst und stellst dich vor."],m:1,t:"Erster Tag im Viertel",lug:"Vor dem Hauseingang",voc:["identidad","supervivencia"],pat:["C020","C021"],gra:["g1","g4"],
d:[["Vecina","Buenos días. Usted es nueva, ¿verdad?","Guten Morgen. Sie sind neu, oder?"],["Tú","Sí, buenos días. Me llamo Katrin y soy de Alemania.","Ja, guten Morgen. Ich heiße Katrin und komme aus Deutschland."],["Vecina","¡Bienvenida! Yo soy Pilar, del cuarto. ¿Y qué hace usted en Madrid?","Willkommen! Ich bin Pilar, aus dem vierten Stock. Und was machen Sie in Madrid?"],["Tú","Estoy aquí por trabajo, dos o tres años. Hablo un poco de español.","Ich bin beruflich hier, zwei oder drei Jahre. Ich spreche ein bisschen Spanisch."],["Vecina","Pues muy bien. Si necesita algo, llame al cuarto B.","Na wunderbar. Wenn Sie etwas brauchen, klingeln Sie im vierten B."],["Tú","Muchas gracias, Pilar. Hasta luego.","Vielen Dank, Pilar. Bis später."]],
q:{p:"Pilar spricht schnell und du verstehst nichts. Was sagst du?",o:["Perdone, ¿puede hablar más despacio?","No, gracias.","Sí, sí, claro."],c:0,e:"Nachfragen ist normal und höflich. Bloßes „sí, sí“ führt schnell zu Missverständnissen."}},
{id:"m2",par:["Frag nach drei Dingen im Haus: buzón, ascensor, supermercado.","Er antwortet absichtlich schnell - sag: ¿Puede repetir, por favor?","Tauscht die Rollen, du bist der Portero."],m:1,t:"Beim Hausmeister",lug:"Im Hauseingang",voc:["supervivencia","ciudad"],pat:["C001","C002"],gra:["g1","g2"],
d:[["Tú","Buenos días. Perdone, ¿hay buzón para mí?","Guten Morgen. Entschuldigung, gibt es einen Briefkasten für mich?"],["Portero","Sí, el 3º C, ¿no? Aquí está la llave pequeña.","Ja, dritter Stock C, oder? Hier ist der kleine Schlüssel."],["Tú","Gracias. ¿Y hay un supermercado por aquí cerca?","Danke. Und gibt es hier in der Nähe einen Supermarkt?"],["Portero","Sí, en la esquina. Está abierto hasta las diez.","Ja, an der Ecke. Er ist bis zehn geöffnet."],["Tú","Perfecto. Muchas gracias, muy amable.","Perfekt. Vielen Dank, sehr nett."]],
q:{p:"Du willst wissen, ob es im Haus einen Aufzug gibt. Wie fragst du?",o:["¿Hay ascensor en el edificio?","¿Está ascensor aquí?","¿Es un ascensor?"],c:0,e:"„hay“ fragt nach Existenz. „está“ fragt nach dem Ort einer bekannten Sache."}},
{id:"m3",par:["Bestell bei ihm ein halbes Kilo von irgendetwas.","Frag ¿Cuánto es? - er nennt einen krummen Preis, wiederhole ihn.","Bezahl und verabschiede dich in einem Satz."],m:2,t:"Auf dem Markt",lug:"Markt in Chamberí",voc:["compra","tiempo"],pat:["C100","C101"],gra:["g3","g11"],
d:[["Tendero","¡Hola! ¿Qué le pongo?","Hallo! Was darf es sein?"],["Tú","Quería medio kilo de tomates y una docena de huevos.","Ich hätte gern ein halbes Kilo Tomaten und ein Dutzend Eier."],["Tendero","Muy bien. ¿Algo más?","Sehr gut. Sonst noch etwas?"],["Tú","No, nada más, gracias. ¿Cuánto es?","Nein, das war's, danke. Was macht das?"],["Tendero","Son cinco euros con veinte.","Das macht fünf Euro zwanzig."],["Tú","Aquí tiene. Gracias, hasta luego.","Hier bitte. Danke, bis später."]],
q:{p:"„¿Qué le pongo?“ heißt wörtlich „Was lege ich Ihnen hin?“. Was ist gemeint?",o:["Was darf es sein?","Wo wohnen Sie?","Zahlen Sie bar?"],c:0,e:"Standardformel an Marktständen und in Bars. Antwort: „Quería …“ oder „Póngame …“."}},
{id:"m4",par:["Spielt die Kasse durch: Tüte, Karte, Kassenbon.","Frag nach etwas ohne Gluten oder ohne Laktose.","Er sagt einmal no queda - reagiere darauf."],m:2,t:"An der Supermarktkasse",lug:"Im Supermarkt",voc:["compra","nucleo"],pat:["C102","C103"],gra:["g5","g6"],
d:[["Cajera","Hola, ¿tiene tarjeta del súper?","Hallo, haben Sie eine Kundenkarte?"],["Tú","No, no tengo. ¿Puedo pagar con tarjeta?","Nein, habe ich nicht. Kann ich mit Karte zahlen?"],["Cajera","Claro. ¿Quiere bolsa?","Klar. Möchten Sie eine Tüte?"],["Tú","Sí, una grande, por favor. ¿Cuánto cuesta la bolsa?","Ja, eine große bitte. Was kostet die Tüte?"],["Cajera","Quince céntimos. Son treinta y dos con diez.","Fünfzehn Cent. Das macht zweiunddreißig zehn."],["Tú","Vale. ¿Me da el ticket, por favor?","Okay. Geben Sie mir bitte den Kassenbon?"]],
q:{p:"Du willst glutenfreies Brot. Was sagst du?",o:["¿Tiene pan sin gluten?","¿Hay pan con gluten?","Quiero gluten, por favor."],c:0,e:"„sin“ = ohne, „con“ = mit. Bei Nachfragen im Laden ist „¿Tiene …?“ die Standardform."}},
{id:"m5",par:["Bestellt zu zweit ein menú del día, jeder zwei Gänge.","Frag nach der Rechnung und nach dem WLAN.","Sag am Schluss, was dir geschmeckt hat: Estaba muy rico."],m:3,t:"Menú del día",lug:"Restaurant im Viertel",voc:["bar"],pat:["C120","C121"],gra:["g8","g9"],
d:[["Camarero","Buenas. ¿Van a comer? Tenemos menú del día.","Hallo. Möchten Sie essen? Wir haben ein Tagesmenü."],["Tú","Sí, el menú, por favor. ¿Qué hay de primero?","Ja, das Menü bitte. Was gibt es als Vorspeise?"],["Camarero","Ensalada, sopa o lentejas.","Salat, Suppe oder Linsen."],["Tú","Para mí, la ensalada. Y de segundo, pollo.","Für mich den Salat. Und als Hauptgang Hähnchen."],["Camarero","¿Para beber?","Zu trinken?"],["Tú","Agua, por favor. Y luego, ¿me trae la cuenta?","Wasser bitte. Und bringen Sie mir danach die Rechnung?"]],
q:{p:"Du bist Vegetarierin und willst das klar sagen.",o:["Soy vegetariana, ¿tiene algo sin carne?","No me gusta la carne, gracias.","Yo como pescado siempre."],c:0,e:"Klar benennen und gleich nach einer Alternative fragen – so muss die Bedienung nicht raten."}},
{id:"m6",par:["Frag ihn um eine Empfehlung: ¿Qué me recomienda?","Sag drei Dinge, die du magst und nicht magst, mit gustar.","Bestell eine caña und eine ración für euch beide."],m:3,t:"Tapas an der Bar",lug:"Bar an der Ecke",voc:["bar","social"],pat:["C122","C123"],gra:["g9","g6"],
d:[["Camarera","¿Qué te pongo?","Was darf ich dir bringen?"],["Tú","Una caña, por favor. Es la primera vez que vengo, ¿qué me recomienda?","Ein kleines Bier bitte. Ich bin zum ersten Mal hier, was empfehlen Sie mir?"],["Camarera","La tortilla está muy rica. Y las croquetas también.","Die Tortilla ist sehr lecker. Und die Kroketten auch."],["Tú","Me gustan mucho las croquetas. Una ración, entonces.","Ich mag Kroketten sehr. Dann eine Portion."],["Camarera","Marchando. ¿Algo más?","Kommt sofort. Sonst noch was?"],["Tú","Nada más de momento, gracias.","Im Moment nichts weiter, danke."]],
q:{p:"Welcher Satz ist grammatisch richtig?",o:["Me gustan las croquetas.","Me gusta las croquetas.","Yo gusto las croquetas."],c:0,e:"Das Verb richtet sich nach dem, was gefällt: Plural → gustan."}},
{id:"m7",par:["Lass dir den Weg zu einem echten Ort in eurer Nähe erklären.","Wiederhole den Weg mit eigenen Worten zurück.","Frag nach: ¿Está lejos? ¿Cuánto se tarda?"],m:4,t:"Nach dem Weg fragen",lug:"Auf der Calle Fuencarral",voc:["ciudad"],pat:["C070","C071"],gra:["g6","g12"],
d:[["Tú","Perdone, ¿dónde está la parada de metro más cercana?","Entschuldigung, wo ist die nächste Metrostation?"],["Señor","Todo recto y luego a la derecha, en la segunda esquina.","Geradeaus und dann rechts, an der zweiten Ecke."],["Tú","¿Está lejos?","Ist das weit?"],["Señor","No, cinco minutos andando.","Nein, fünf Minuten zu Fuß."],["Tú","¿Y cómo se va a Atocha desde allí?","Und wie kommt man von dort nach Atocha?"],["Señor","Tiene que cambiar de línea en Sol.","Sie müssen in Sol umsteigen."]],
q:{p:"Was heißt „Tiene que cambiar de línea“?",o:["Sie müssen umsteigen.","Sie können hier bleiben.","Die Linie ist gesperrt."],c:0,e:"tener que + Infinitiv = müssen. Der häufigste Weg, eine Notwendigkeit auszudrücken."}},
{id:"m8",par:["Erklär ihm, dass du noch keine Karte hast und eine brauchst.","Frag nach Preis, Dauer und Abholung.","Bitte einmal um Wiederholung, ohne ins Deutsche zu wechseln."],m:4,t:"Monatskarte kaufen",lug:"Am Kiosk (estanco)",voc:["transporte","tiempo"],pat:["C080","C081"],gra:["g12","g7"],
d:[["Tú","Buenas tardes. Quería el abono transporte mensual.","Guten Tag. Ich hätte gern die Monatskarte."],["Empleado","¿Tiene ya la tarjeta o es nueva?","Haben Sie schon die Karte oder ist sie neu?"],["Tú","Es nueva. No tengo nada todavía.","Sie ist neu. Ich habe noch nichts."],["Empleado","Entonces hay que pedirla por internet y recogerla aquí.","Dann muss man sie im Internet beantragen und hier abholen."],["Tú","¿Cuánto se tarda?","Wie lange dauert das?"],["Empleado","Unos días. Mientras tanto, puede comprar billetes sueltos.","Ein paar Tage. In der Zwischenzeit können Sie Einzeltickets kaufen."]],
q:{p:"Wie sagst du „Ich habe noch keine Karte“?",o:["Todavía no tengo tarjeta.","No tengo ya tarjeta.","Nunca tengo tarjeta."],c:0,e:"todavía no = noch nicht. „ya no“ hieße dagegen: nicht mehr."}},
{id:"m9",par:["Beschreib die Wohnung, die ihr sucht: Zimmer, Lage, Preis.","Frag nach gastos, fianza und Lärm.","Er spielt Makler und antwortet ausweichend - hak nach."],m:5,t:"Wohnungsbesichtigung",lug:"Wohnungsbesichtigung in Chamberí",voc:["vivienda"],pat:["C050","C051"],gra:["g13","g10"],
d:[["Agente","Este es el piso. Tiene dos habitaciones y cocina nueva.","Das ist die Wohnung. Sie hat zwei Zimmer und eine neue Küche."],["Tú","Estamos buscando algo tranquilo. ¿Da a la calle?","Wir suchen etwas Ruhiges. Geht sie zur Straße raus?"],["Agente","Da al patio, es muy silencioso.","Sie geht zum Innenhof, sehr ruhig."],["Tú","¿Están incluidos los gastos en el alquiler?","Sind die Nebenkosten in der Miete enthalten?"],["Agente","La comunidad sí, la luz y el agua no.","Das Hausgeld ja, Strom und Wasser nicht."],["Tú","Entendido. ¿Y cuánto es la fianza?","Verstanden. Und wie hoch ist die Kaution?"]],
q:{p:"Wie sagst du, dass ihr gerade eine möblierte Wohnung sucht?",o:["Estamos buscando un piso amueblado.","Buscamos ayer un piso amueblado.","Vamos a buscado un piso."],c:0,e:"estar + Gerundio beschreibt, was gerade im Gange ist."}},
{id:"m10",par:["Ruf ihn an: etwas in der Wohnung ist kaputt.","Sag seit wann, warum es dringend ist, und bitte um einen Termin.","Er verschiebt - bleib freundlich, aber bestehe darauf."],m:5,t:"Die Heizung ist kaputt",lug:"Anruf beim Vermieter",voc:["vivienda","problemas"],pat:["C052","C053"],gra:["g14","g7"],
d:[["Tú","Buenas tardes, señor Ruiz. Le llamo porque no funciona la calefacción.","Guten Tag, Herr Ruiz. Ich rufe an, weil die Heizung nicht funktioniert."],["Casero","¿Desde cuándo?","Seit wann?"],["Tú","Desde el sábado. En casa hace mucho frío.","Seit Samstag. In der Wohnung ist es sehr kalt."],["Casero","Voy a llamar al fontanero.","Ich rufe den Klempner an."],["Tú","¿Me lo puede arreglar esta semana? Tenemos un niño pequeño.","Können Sie mir das diese Woche reparieren lassen? Wir haben ein kleines Kind."],["Casero","Intento que venga mañana por la tarde.","Ich versuche, dass er morgen Nachmittag kommt."]],
q:{p:"Der Aufzug ist defekt. Was sagst du?",o:["No funciona el ascensor.","El ascensor no está.","No hay ascensor."],c:0,e:"„no funciona“ = defekt. „no hay“ hieße: es gibt gar keinen."}},
{id:"m25",par:["Meld Strom und Internet an: Name, Adresse, Wunschdatum.","Frag nach permanencia, cuota und Anschlusstermin.","Lies ihm eine IBAN und einen Zählerstand laut vor."],m:5,t:"Strom, Internet, Handy",lug:"Versorger am Telefon",voc:["banco","comunicacion"],pat:["C180","C181"],gra:["g26","g25"],
d:[["Agente","Compañía Iberluz, buenos días.","Iberluz, guten Morgen."],["Tú","Buenos días. Quería dar de alta la luz en un piso nuevo.","Guten Morgen. Ich möchte den Strom für eine neue Wohnung anmelden."],["Agente","¿Me dice el titular, la dirección y el número de contador?","Nennen Sie mir Vertragsinhaber, Adresse und Zählernummer?"],["Tú","Sí, se lo digo. ¿Puedo domiciliar los recibos en mi cuenta?","Ja, ich sage es Ihnen. Kann ich die Rechnungen von meinem Konto abbuchen lassen?"],["Agente","Claro, necesito el IBAN. El alta tarda unas 48 horas.","Klar, ich brauche die IBAN. Die Anmeldung dauert etwa 48 Stunden."],["Tú","Perfecto. ¿Y la tarifa tiene permanencia?","Perfekt. Und hat der Tarif eine Mindestlaufzeit?"]],
q:{p:"Du willst den Handyvertrag kündigen. Was sagst du?",o:["Quería dar de baja la línea.","Quería dar de alta la línea.","Quería la permanencia."],c:0,e:"dar de alta heißt anmelden, dar de baja abmelden. Zwei Wörter, entgegengesetzte Wirkung."}},
{id:"m11",par:["Buch ein cita previa am Telefon, für drei Personen.","Frag nach den nötigen Unterlagen.","Wiederhole Datum und Uhrzeit zur Bestätigung."],m:6,t:"Cita previa am Telefon",lug:"Rathaus von Madrid",voc:["tramites","tiempo"],pat:["C160","C161"],gra:["g15","g11"],
d:[["Funcionaria","Ayuntamiento, buenos días.","Rathaus, guten Morgen."],["Tú","Buenos días. Quería pedir cita previa para el empadronamiento.","Guten Morgen. Ich möchte einen Termin für die Anmeldung beantragen."],["Funcionaria","¿Para cuántas personas?","Für wie viele Personen?"],["Tú","Para tres: mi marido, nuestro hijo y yo.","Für drei: mein Mann, unser Sohn und ich."],["Funcionaria","Tengo el martes 14 a las nueve y media.","Ich habe Dienstag, den 14., um halb zehn."],["Tú","Perfecto. ¿Qué documentos necesito?","Perfekt. Welche Unterlagen brauche ich?"]],
q:{p:"Wie sagst du: „Ich werde morgen die Papiere bringen“?",o:["Mañana voy a llevar los papeles.","Mañana llevaba los papeles.","Mañana he llevado los papeles."],c:0,e:"ir a + Infinitiv ist die gesprochene Zukunft."}},
{id:"m12",par:["Er ist Beamter, du bist am Schalter: nenn dein Anliegen in einem Satz.","Frag nach einem Feld im Formular, das du nicht verstehst.","Bedank dich und frag, wann das Dokument fertig ist."],m:6,t:"Am Schalter",lug:"Im Bürgerbüro",voc:["tramites"],pat:["C162","C163"],gra:["g20","g12"],
d:[["Funcionario","Siguiente. Dígame.","Der Nächste. Was kann ich für Sie tun?"],["Tú","Tengo cita a las nueve y media. Vengo a solicitar el certificado de empadronamiento.","Ich habe einen Termin um halb zehn. Ich komme, um die Meldebescheinigung zu beantragen."],["Funcionario","Pasaporte y contrato de alquiler, por favor. Rellene este formulario y firme abajo.","Reisepass und Mietvertrag, bitte. Füllen Sie dieses Formular aus und unterschreiben Sie unten."],["Tú","Perdone, ¿podría explicármelo otra vez? No he entendido esta casilla.","Entschuldigung, könnten Sie mir das noch einmal erklären? Dieses Feld habe ich nicht verstanden."],["Funcionario","Aquí pone el número de su documento. Y aquí la fecha de entrada en España.","Hier kommt Ihre Ausweisnummer hin. Und hier das Einreisedatum."],["Tú","Ahora sí. Muchas gracias por su paciencia.","Jetzt ja. Vielen Dank für Ihre Geduld."]],
q:{p:"Was bedeutet „Rellene este formulario y firme abajo“?",o:["Füllen Sie das Formular aus und unterschreiben Sie unten.","Lesen Sie das Formular und warten Sie draußen.","Bringen Sie das Formular morgen zurück."],c:0,e:"Höflicher Imperativ auf usted: rellenar → rellene, firmar → firme."}},
{id:"m13",par:["Meld dein Kind für eine AG an: Tag, Uhrzeit, Abholung.","Frag nach Kosten, Betreuer und was es zu essen gibt.","Er sagt, der Kurs sei voll - frag nach einer Warteliste."],m:7,t:"Nachmittagsbetreuung und AGs",lug:"Im Sekretariat der Schule",voc:["social","gente"],pat:["C220","C221"],gra:["g15","g14"],
d:[["Secretaria","Buenos días, ¿en qué puedo ayudarle?","Guten Morgen, wie kann ich Ihnen helfen?"],["Tú","Quería apuntar a mi hijo a una actividad extraescolar.","Ich möchte meinen Sohn für eine AG anmelden."],["Secretaria","Tenemos fútbol los martes y robótica los jueves.","Wir haben dienstags Fußball und donnerstags Robotik."],["Tú","Robótica, entonces. ¿A qué hora hay que recogerlo?","Dann Robotik. Wann muss man ihn abholen?"],["Secretaria","A las cinco. ¿Se queda también al comedor?","Um fünf. Bleibt er auch zum Mittagessen?"],["Tú","Sí. ¿Y hay merienda antes de la actividad?","Ja. Und gibt es vor der AG einen Snack?"]],
q:{p:"Der Kurs ist voll. Wie fragst du nach einer Warteliste?",o:["¿Puede ponerlo en lista de espera?","¿Puedo pagar más?","¿Está cerrado el colegio?"],c:0,e:"lista de espera ist die Warteliste - der Standardsatz, wenn Plätze knapp sind."}},
{id:"m14",par:["Er ist tutor: frag, wie sich dein Kind eingewöhnt.","Sag, dass es noch Spanisch lernt, und frag nach Unterstützung.","Frag nach einer konkreten Sache für zu Hause."],m:7,t:"Elterngespräch",lug:"Elterngespräch",voc:["gente","social"],pat:["C222","C223"],gra:["g16","g13"],
d:[["Tutora","Gracias por venir. Su hijo está muy bien integrado.","Danke, dass Sie gekommen sind. Ihr Sohn ist gut integriert."],["Tú","Me alegro. Todavía está aprendiendo español, ¿le cuesta seguir la clase?","Das freut mich. Er lernt noch Spanisch – fällt es ihm schwer, dem Unterricht zu folgen?"],["Tutora","Un poco en lengua, pero mejora cada semana.","Ein bisschen in Sprache, aber es wird jede Woche besser."],["Tú","¿Cómo se está adaptando con los compañeros?","Wie gewöhnt er sich bei den Mitschülern ein?"],["Tutora","Muy bien. Juega con todos en el recreo.","Sehr gut. Er spielt in der Pause mit allen."],["Tú","¿Podemos hacer algo en casa para ayudarle?","Können wir zu Hause etwas tun, um ihm zu helfen?"]],
q:{p:"Wie sagst du: „Meine Tochter lernt noch Spanisch“?",o:["Mi hija todavía está aprendiendo español.","Mi hija ya aprende español nunca.","Mi hija está aprender español."],c:0,e:"estar + Gerundio, plus todavía für „noch“."}},
{id:"m15",par:["Beschreib drei Beschwerden mit doler und seit wann.","Beantworte seine Rückfragen zu fiebre und alergias.","Frag, ob du arbeiten gehen kannst."],m:8,t:"Im Gesundheitszentrum",lug:"Im Gesundheitszentrum",voc:["salud"],pat:["C140","C141"],gra:["g9","g16"],
d:[["Médica","Buenos días, siéntese. ¿Qué le pasa?","Guten Morgen, setzen Sie sich. Was fehlt Ihnen?"],["Tú","Desde hace tres días me encuentro mal. Me duele mucho la garganta.","Seit drei Tagen fühle ich mich schlecht. Mein Hals tut sehr weh."],["Médica","¿Tiene fiebre?","Haben Sie Fieber?"],["Tú","Sí, treinta y ocho y medio. Y tos por la noche.","Ja, achtunddreißig fünf. Und nachts Husten."],["Médica","Vamos a mirar. ¿Es alérgica a algún medicamento?","Schauen wir mal. Sind Sie gegen ein Medikament allergisch?"],["Tú","Soy alérgica a la penicilina.","Ich bin allergisch gegen Penicillin."]],
q:{p:"Dein Kopf tut weh. Was sagst du?",o:["Me duele la cabeza.","Yo duelo la cabeza.","Me duelen la cabeza."],c:0,e:"doler funktioniert wie gustar: Singular → duele."}},
{id:"m16",par:["Kauf in der Apotheke etwas ohne Rezept.","Frag nach Dosierung und ob es für ein Kind geeignet ist.","Lass dir die Einnahme erklären und wiederhole sie."],m:8,t:"In der Apotheke",lug:"In der Apotheke",voc:["salud","casa"],pat:["C142","C143"],gra:["g20","g6"],
d:[["Farmacéutico","Hola, dígame.","Hallo, bitte."],["Tú","¿Necesito receta para algo contra la tos?","Brauche ich ein Rezept für etwas gegen Husten?"],["Farmacéutico","No, este jarabe no lleva receta.","Nein, für diesen Saft braucht man kein Rezept."],["Tú","¿Cómo se toma?","Wie nimmt man ihn ein?"],["Farmacéutico","Una cucharada cada ocho horas, después de comer.","Einen Löffel alle acht Stunden, nach dem Essen."],["Tú","Vale. ¿Y es apto para niños?","Alles klar. Und ist er für Kinder geeignet?"]],
q:{p:"Was heißt „no lleva receta“?",o:["Es ist rezeptfrei.","Es ist verschreibungspflichtig.","Es ist ausverkauft."],c:0,e:"„llevar“ heißt hier: etwas enthalten/erfordern – häufige Alltagsbedeutung."}},
{id:"m26",par:["Beschreib einen Diebstahl in drei Sätzen: was, wo, wann.","Beantworte Rückfragen zu Marke, Farbe und Uhrzeit.","Frag nach einer Kopie der Anzeige für die Versicherung."],m:8,t:"Diebstahl anzeigen",lug:"Auf der Polizeiwache",voc:["tramites","problemas"],pat:["C164","C165"],gra:["g19","g17"],
d:[["Policía","Buenas tardes, dígame.","Guten Tag, bitte."],["Tú","Me han robado el móvil esta mañana en el metro.","Man hat mir heute Morgen in der Metro das Handy gestohlen."],["Policía","¿En qué línea y a qué hora?","Auf welcher Linie und um wie viel Uhr?"],["Tú","En la línea 1, sobre las ocho y media, entre Sol y Atocha.","Auf der Linie 1, gegen halb neun, zwischen Sol und Atocha."],["Policía","¿Lo tenía en el bolso o en el bolsillo?","Hatten Sie es in der Tasche oder in der Hosentasche?"],["Tú","En el bolsillo. ¿Me puede dar una copia de la denuncia para el seguro?","In der Hosentasche. Können Sie mir eine Kopie der Anzeige für die Versicherung geben?"]],
q:{p:"Was heißt „Me han robado la cartera“?",o:["Man hat mir die Geldbörse gestohlen.","Ich habe die Geldbörse verloren.","Ich suche eine Geldbörse."],c:0,e:"robar mit Perfecto und indirektem Pronomen - die übliche Form bei Diebstahl."}},
{id:"m17",par:["Bestätige einen Termin und verschieb ihn dann höflich.","Frag: ¿Le viene bien el viernes a las diez?","Sag, was du schon geschickt hast, im Perfecto."],m:9,t:"Kundenbesuch bestätigen",lug:"Telefon und E-Mail",voc:["trabajo","tiempo"],pat:["C200","C201"],gra:["g19","g21"],
d:[["Tú","Buenos días, señora Ortega. Le llamo para confirmar la visita del jueves.","Guten Morgen, Frau Ortega. Ich rufe an, um den Besuch am Donnerstag zu bestätigen."],["Cliente","Sí, aunque el jueves lo tengo complicado.","Ja, allerdings ist Donnerstag bei mir schwierig."],["Tú","¿Le viene bien el viernes a las diez?","Passt Ihnen Freitag um zehn?"],["Cliente","El viernes sí. ¿Me ha enviado ya el presupuesto?","Freitag ja. Haben Sie mir schon das Angebot geschickt?"],["Tú","Ya se lo he enviado esta mañana por correo.","Ich habe es Ihnen heute Morgen schon per Mail geschickt."],["Cliente","Perfecto, lo miro y hablamos el viernes.","Perfekt, ich schaue es mir an und wir sprechen am Freitag."]],
q:{p:"„Heute habe ich schon mit dem Kunden gesprochen.“",o:["Hoy ya he hablado con el cliente.","Hoy ya hablaba con el cliente.","Hoy ya hablé con el cliente ayer."],c:0,e:"In Madrid steht für „heute / diese Woche“ meist das Perfecto."}},
{id:"m18",par:["Überbring eine schlechte Nachricht in zwei Sätzen.","Biete zwei Lösungen an mit podríamos.","Er ist verärgert - reagiere ruhig und bestätige schriftlich."],m:9,t:"Verspätung und Lösung",lug:"Beim Kunden vor Ort",voc:["trabajo","problemas"],pat:["C202","C203"],gra:["g21","g27"],

/* ---------- Zustand ---------- */
const KEY="valleluna_v1";
const DEF={xp:0,srs:{},done:{},prog:{},habla:{},copia:0,activos:0,dia:{fecha:"",hecho:0,meta:12,nuevas:0},logros:[],stats:{total:0,aciertos:0,perfectas:0},streak:{last:"",dias:0},inicio:"",set:{de:true,voz:true,test:false,buho:"a",fondo:"foto"}};
let S=load();
/* Ältere Speicherstände können neue Felder noch nicht kennen: verschachtelt zusammenführen */
function load(){
 const nuevo=()=>{const s=JSON.parse(JSON.stringify(DEF));s.inicio=hoy();return s;};
 try{const r=localStorage.getItem(KEY);if(!r)return nuevo();
  const v=JSON.parse(r),s=Object.assign(nuevo(),v);
  ["set","dia","stats","streak"].forEach(k=>s[k]=Object.assign({},DEF[k],v[k]||{}));
  ["srs","done","prog","habla"].forEach(k=>s[k]=v[k]||{});
  s.logros=Array.isArray(v.logros)?v.logros:[];
  return s;}catch(e){return nuevo();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("Speichern nicht möglich – läuft der Browser im privaten Modus?");}}
function hoy(){const d=new Date();return d.toISOString().slice(0,10);}
function ahora(){return Date.now();}

/* ---------- Karten-Register ---------- */
const CARDS={};
/* Artikel für Substantive: Regeln plus Ausnahmenliste, im Zweifel ohne Artikel */
const EL=new Set("día mapa problema tema sistema idioma clima programa planeta sofá tranvía taxi coche cine café pie padre hombre paisaje viaje garaje mensaje traje equipaje aire parque".split(" "));
const LA=new Set("mano foto moto radio carne clase noche tarde llave calle gente parte fuente suerte leche sal piel red luz voz vez flor labor".split(" "));
const EL_A=new Set("agua alma aula hambre área".split(" "));
function articulo(es){
 if(/^(el|la|los|las|un|una) /.test(es)||es.includes(" "))return "";
 const w=es.toLowerCase();
 if(EL_A.has(w))return "el";
 if(EL.has(w))return "el";
 if(LA.has(w))return "la";
 if(/(ción|sión|dad|tad|tud|umbre|eza|encia|ancia)$/.test(w))return "la";
 if(/(ma|ta)$/.test(w))return "";
 if(/a$/.test(w))return "la";
 if(/(o|or|aje|ambre)$/.test(w))return "el";
 return "";}
THEMES.forEach(t=>VOCAB[t.id].forEach((s,i)=>{const[es,de,niv,fl="",sem="1"]=s.split("|");
 const n=fl.includes("n"),art=n?articulo(es):"";
 CARDS["v:"+t.id+":"+i]={id:"v:"+t.id+":"+i,es,de,niv,M:fl.includes("M"),rez:fl.includes("r"),
  sust:n,art,muestra:art?art+" "+es:es,prio:(fl.match(/[ABC]/)||["B"])[0],sem:+sem,th:t.id,tipo:"palabra"};}));
PATTERNS.forEach(p=>{CARDS["s:"+p.id]={id:"s:"+p.id,es:p.es,de:p.de,niv:p.niv,M:p.M,clase:p.tipo,fn:p.fn,sem:p.sem,th:p.th,tipo:"bloque",ej:p.ej};});
const ETIQ=c=>[c.niv,c.M?"España":"",c.rez?"verstehen":"",c.clase==="scaffold"?"Scaffold":c.clase==="chunk"?"Chunk":""].filter(Boolean);
const CARDLIST=Object.values(CARDS);
const themeName=id=>(THEMES.find(t=>t.id===id)||{n:id}).n;
const gramById=id=>GRAMMAR.find(g=>g.id===id);

/* Wortschatz einer Mission: erste bzw. zweite Hälfte der Themenlisten */
/* Wortschatz einer Mission: Themen der Mission, gefiltert über die Lernwoche der Datenbank */
const SEM_POR_REGION=4.34;
function vocabDeMision(mi){
 const idx=MISSIONS.findIndex(x=>x.id===mi.id),seg=idx%2;
 const desde=(mi.m-1)*SEM_POR_REGION, hasta=mi.m*SEM_POR_REGION;
 const enTema=CARDLIST.filter(c=>c.tipo==="palabra"&&mi.voc.includes(c.th));
 let banda=enTema.filter(c=>c.sem>desde&&c.sem<=hasta);
 if(banda.length<14)banda=banda.concat(enTema.filter(c=>c.sem<=desde&&!banda.includes(c)).slice(0,20));
 if(banda.length<14)banda=banda.concat(enTema.filter(c=>!banda.includes(c)).slice(0,20));
 const mitad=Math.ceil(banda.length/2);
 const parte=seg===0?banda.slice(0,mitad):banda.slice(mitad);
 return (parte.length>=10?parte:banda).slice(0,18);
}
const cardsDeMision=mi=>vocabDeMision(mi).concat(mi.pat.map(p=>CARDS["s:"+p]));

/* ---------- SRS (Leitner) ---------- */
const INT=[0,1,2,4,8,16,32,64];
function srs(id){return S.srs[id];}
function activar(ids){ids.forEach(id=>{if(!S.srs[id])S.srs[id]={b:1,due:ahora()+864e5,v:0,f:0};});}
function responder(id,ok){const c=S.srs[id]||(S.srs[id]={b:0,due:0,v:0,f:0});
 if(ok){c.b=Math.min(7,c.b+1);c.v++;c.due=ahora()+INT[c.b]*864e5;}
 else{c.b=Math.max(1,c.b-1);c.f++;c.due=ahora()+6e5;}}
function vencidas(){return Object.keys(S.srs).filter(id=>CARDS[id]&&S.srs[id].due<=ahora()).map(id=>CARDS[id]);}
function dominio(id){const c=S.srs[id];return c?Math.min(100,Math.round(c.b/6*100)):0;}

/* Karten, die in keiner Mission vorkommen, aber zu offenen Regionen gehören */
const EN_MISIONES=new Set(MISSIONS.flatMap(m=>cardsDeMision(m).map(c=>c.id)));
const ORDEN_NIV={A1:0,A2:1,B1:2};
/* Drosselung: je größer der Wiederholungsstau, desto weniger Neues */
function nuevasPorDia(){const due=vencidas().length;
 return due>45?0:due>30?3:due>18?5:8;}
/* Neue Einheiten folgen der Lernwoche der Datenbank */
function cartasNuevas(){
 const sem=semanaActual()+1;
 return CARDLIST.filter(c=>!S.srs[c.id]&&!EN_MISIONES.has(c.id)&&(c.sem||1)<=sem)
  .sort((a,b)=>((a.sem||1)-(b.sem||1))||("ABC".indexOf(a.prio||"B")-"ABC".indexOf(b.prio||"B"))||(ORDEN_NIV[a.niv]-ORDEN_NIV[b.niv])||((a.rez?1:0)-(b.rez?1:0)));}
const reservaTotal=()=>CARDLIST.filter(c=>!EN_MISIONES.has(c.id)).length;
const restanHoy=()=>Math.max(0,nuevasPorDia()-(dia().nuevas||0));

/* Erinnerung an die Sicherung: ein Jahr Fortschritt hängt an einem Browser */
const DIAS_COPIA=30;
const copiaVieja=()=>!S.copia||(Date.now()-S.copia)>DIAS_COPIA*864e5;
function avisoCopia(){return copiaVieja()&&Object.keys(S.srs).length>40
 ? `<div class="card" style="border-color:var(--farol)"><p class="eyebrow">Sicherung</p>
   <h3>${S.copia?"Deine letzte Sicherung ist über einen Monat alt":"Noch keine Sicherung angelegt"}</h3>
   <p class="muted small">Alles steht nur in diesem Browser. Ein geleerter Speicher löscht ${Object.keys(S.srs).length} Karten und ${S.xp} XP.
    Unter „Ich" liegt der Sicherungstext zum Kopieren.</p>
   <button class="btn sec" id="ircopia">Zur Sicherung</button></div>`:"";}

/* ---------- Tagesziel ---------- */
function dia(){if(!S.dia)S.dia={fecha:"",hecho:0,meta:12,nuevas:0};
 if(S.dia.fecha!==hoy()){S.dia.fecha=hoy();S.dia.hecho=0;S.dia.nuevas=0;S.dia.contado=false;}
 return S.dia;}
const MENSAJES=[[0,"Noch nichts heute. Zehn Minuten reichen."],[20,"Guter Start."],[40,"Du bist gut dabei."],
 [60,"Mehr als die Hälfte."],[80,"Fast am Ziel."],[100,"Tagesziel geschafft."]];
function metaDiaria(){const d=dia(),pc=Math.min(100,Math.round(d.hecho/d.meta*100));
 const msg=MENSAJES.reduce((a,m)=>pc>=m[0]?m:a,MENSAJES[0])[1];
 return `<div class="card"><div style="display:flex;align-items:flex-end;gap:14px">
  <div><div class="cifra">${Math.min(d.hecho,d.meta)}<span style="font-size:1.1rem;color:var(--crema2)">/${d.meta}</span></div>
   <div class="rotulo">Aufgaben heute</div></div>
  <div style="flex:1"><div class="xpbar" role="img" aria-label="Tagesziel zu ${pc} Prozent"><i style="width:${pc}%"></i></div>
   <p class="small muted" style="margin:8px 0 0">${esc(msg)}</p></div>
  <div style="text-align:right"><div class="cifra">${S.streak.dias}</div><div class="rotulo">Tage am Stück</div></div>
 </div></div>`;}

/* ---------- XP, Level, Streak ---------- */
const TITULOS=["Recién llegado","Vecino nuevo","Vecino conocido","Habitual del barrio","Madrileño de adopción","Uno más del portal"];
const nivel=()=>Math.min(6,1+Math.floor(S.xp/450));
const tituloNivel=()=>TITULOS[nivel()-1];
function darXP(n){S.xp+=n;marcarDia();save();}
function marcarDia(){const h=hoy();if(S.streak.last===h)return;
 const ayer=new Date(Date.now()-864e5).toISOString().slice(0,10);
 S.streak.dias=(S.streak.last===ayer)?S.streak.dias+1:1;S.streak.last=h;}
/* Kalenderwoche seit Beginn - nur zur Anzeige und für den Puffer */
function semanaCalendario(){if(!S.inicio)S.inicio=hoy();
 const d=Math.floor((Date.now()-new Date(S.inicio).getTime())/864e5);return Math.max(1,Math.floor(d/7)+1);}
/* Lernwoche: fünf gelernte Tage sind eine Woche. Ausgefallene Wochen kosten keinen Stoff. */
function semanaActual(){return Math.max(1,Math.min(52,Math.floor((S.activos||0)/5)+1));}
/* Puffer: bis zu drei Monate Rückstand werden hinten angehängt */
const PUFFER=91;
function retraso(){return Math.min(PUFFER,Math.max(0,(semanaCalendario()-semanaActual())*7));}
const pufferRestante=()=>PUFFER-retraso();
function fechaMeta(mes){const d=new Date(mes.fin);d.setDate(d.getDate()+retraso());return d.toISOString().slice(0,10);}
const misionesDelMes=n=>MISSIONS.filter(m=>m.m===n);
const mesCompleto=n=>misionesDelMes(n).every(m=>S.done[m.id]);
/* Kalender: der Kurs hängt am echten Umzugsdatum */
const MUDANZA="2027-08-01";
const diasHasta=f=>Math.ceil((new Date(f).getTime()-Date.now())/864e5);
const fechaCorta=f=>new Date(f).toLocaleDateString("de-DE",{day:"2-digit",month:"short",year:"2-digit"});
function regionRecomendada(){const x=MESES.find(m=>diasHasta(fechaMeta(m))>=0);return x?x.n:12;}
/* Reifegrad: wie viel einer Region wirklich sitzt (Box 3+) */
function madurez(n){const ids=[...new Set(misionesDelMes(n).flatMap(m=>cardsDeMision(m).map(c=>c.id)))];
 if(!ids.length)return 0;
 return Math.round(ids.filter(id=>S.srs[id]&&S.srs[id].b>=3).length/ids.length*100);}
const UMBRAL=60;
const desbloqueado=n=>S.set.test||n===1||(mesCompleto(n-1)&&madurez(n-1)>=UMBRAL);

const GENERO=[["encantado","encantada"],["alemán","alemana"],["vegetariano","vegetariana"],["alérgico","alérgica"],
["cansado","cansada"],["contento","contenta"],["enfermo","enferma"],["seguro","segura"],["tranquilo","tranquila"],

const PAREJAS=new Set();GENERO.forEach(([m,f])=>{PAREJAS.add(norm(m)+"|"+norm(f));PAREJAS.add(norm(f)+"|"+norm(m));});

/* akzeptiert die weibliche wie die männliche Form, Synonyme und den Artikel */
const SIN_ART=s=>norm(s).replace(/^(el|la|los|las|un|una) /,"");
function sinonimos(sol){
 const k=norm(sol);
 if(!POR_SENTIDO.listo){CARDLIST.forEach(c=>{if(c.tipo!=="palabra")return;
  (POR_SENTIDO[norm(c.de)]=POR_SENTIDO[norm(c.de)]||[]).push(c.es);});POR_SENTIDO.listo=true;}
 const card=CARDLIST.find(c=>norm(c.es)===k);
 return card?(POR_SENTIDO[norm(card.de)]||[]):[];}
function aceptable(r,c){
 const a=norm(r),b=norm(c);
 if(a===b)return {ok:true,gen:false};
 if(SIN_ART(a)===SIN_ART(b))return {ok:true,gen:false};
 if(sinonimos(c).some(s=>SIN_ART(s)===SIN_ART(a)))return {ok:true,gen:false,sin:true};
 const pa=a.split(" "),pb=b.split(" ");
 if(pa.length!==pb.length)return {ok:false,gen:false};
 let gen=false;
 const igual=pb.every((w,i)=>{if(w===pa[i])return true;
  if(PAREJAS.has(w+"|"+pa[i])){gen=true;return true;}return false;});
 return {ok:igual,gen};}

 if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

/* ---------- Hintergrund & Konfetti ---------- */
function cielo(){const c=$("#sky"),x=c.getContext("2d");
 const w=c.width=innerWidth,h=c.height=innerHeight;x.clearRect(0,0,w,h);
 for(let i=0;i<70;i++){const r=Math.random()*1.3+.3;x.globalAlpha=Math.random()*.7+.2;x.fillStyle="#f5edda";
  x.beginPath();x.arc(Math.random()*w,Math.random()*h*.75,r,0,7);x.fill();}}
addEventListener("resize",cielo);
/* Mondfunken: kleine Fellwesen, die Laternen und Sterne nach oben tragen */
function dibujaFunke(x,g,r,t,tipo){
 const f=$("#confetti").getContext("2d");
 f.save();f.translate(x,g);f.rotate(Math.sin(t/22)*.12);
 // Fell
 f.strokeStyle="#151d26";f.lineWidth=Math.max(1,r*.13);
 for(let i=0;i<18;i++){const a=i/18*Math.PI*2+t/60;
  f.beginPath();f.moveTo(Math.cos(a)*r*.86,Math.sin(a)*r*.86);
  f.lineTo(Math.cos(a)*r*1.42,Math.sin(a)*r*1.42);f.stroke();}
 // Beine
 f.lineWidth=Math.max(1,r*.1);
 f.beginPath();f.moveTo(-r*.4,r*.8);f.quadraticCurveTo(-r*1.1,r*1.7,-r*.5,r*2.1);
 f.moveTo(r*.4,r*.8);f.quadraticCurveTo(r*1.2,r*1.6,r*.6,r*2.2);f.stroke();
 // Körper
 f.fillStyle="#1d2630";f.beginPath();f.arc(0,0,r,0,7);f.fill();
 // Augen
 f.fillStyle="#fdf8ec";
 f.beginPath();f.ellipse(-r*.3,-r*.1,r*.3,r*.34,0,0,7);f.fill();
 f.beginPath();f.ellipse(r*.32,-r*.13,r*.3,r*.34,0,0,7);f.fill();
 f.fillStyle="#141c25";const gx=Math.sin(t/30)*r*.07;
 f.beginPath();f.arc(-r*.26+gx,-r*.06,r*.14,0,7);f.fill();
 f.beginPath();f.arc(r*.36+gx,-r*.09,r*.14,0,7);f.fill();
 // Fracht: Laterne oder Stern
 f.translate(r*1.1,-r*1.7);
 if(tipo){f.fillStyle="#f2b45c";f.shadowColor="rgba(242,180,92,.9)";f.shadowBlur=r*1.6;
  f.beginPath();
  for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,d=i%2?r*.3:r*.72;
   i?f.lineTo(Math.cos(a)*d,Math.sin(a)*d):f.moveTo(Math.cos(a)*d,Math.sin(a)*d);}
  f.closePath();f.fill();}
 else{f.fillStyle="#f6d79a";f.shadowColor="rgba(242,180,92,.9)";f.shadowBlur=r*1.8;
  f.beginPath();f.moveTo(-r*.32,-r*.3);f.lineTo(r*.32,-r*.3);f.lineTo(r*.24,r*.42);f.lineTo(-r*.24,r*.42);
  f.closePath();f.fill();
  f.shadowBlur=0;f.strokeStyle="#151d26";f.lineWidth=Math.max(1,r*.09);
  f.beginPath();f.moveTo(-r*.3,-r*.32);f.lineTo(r*.3,-r*.32);f.moveTo(0,-r*.32);f.quadraticCurveTo(0,-r*.8,r*.5,-r*.7);f.stroke();}
 f.restore();}
function chispas(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const c=$("#confetti"),f=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cols=["#f2b45c","#95c98c","#79c6d2","#eb9aa4","#f5edda"];
 const x0=innerWidth/2,y0=innerHeight*.62;
 const E=Array.from({length:20},()=>{const a=Math.random()*Math.PI*2,v=2+Math.random()*4.5;
  return {x:x0,y:y0,vx:Math.cos(a)*v*.55,vy:(Math.sin(a)*v-2)*.55,r:3+Math.random()*3.4,c:cols[~~(Math.random()*5)],g:Math.random()*6};});
 const F=Array.from({length:3},(_,i)=>({x:x0+(i-1)*70,y:y0+40,r:10+Math.random()*4,v:.85+Math.random()*.6,fase:Math.random()*90,tipo:i%2}));
 let t=0;(function paso(){t++;f.clearRect(0,0,c.width,c.height);f.globalAlpha=t<110?1:Math.max(0,1-(t-110)/40);
  E.forEach(e=>{e.x+=e.vx;e.y+=e.vy;e.vy+=.045;e.g+=.07;f.save();f.translate(e.x,e.y);f.rotate(e.g);
   f.fillStyle=e.c;f.beginPath();
   for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,d=i%2?e.r*.42:e.r;
    i?f.lineTo(Math.cos(a)*d,Math.sin(a)*d):f.moveTo(Math.cos(a)*d,Math.sin(a)*d);}
   f.closePath();f.fill();f.restore();});
  F.forEach(q=>{q.y-=q.v;dibujaFunke(q.x+Math.sin((t+q.fase)/30)*12,q.y,q.r,t+q.fase,q.tipo);});
  if(t<150)requestAnimationFrame(paso);else f.clearRect(0,0,c.width,c.height);})();}
function fiesta(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const c=$("#confetti"),f=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const N=Math.min(14,Math.round(innerWidth/34));

/* ---------- Übungsgenerator ---------- */
function distractores(card,n){
 const mismo=c=>norm(c.de)===norm(card.de)||norm(c.es)===norm(card.es);
 const pool=CARDLIST.filter(c=>c.tipo===card.tipo&&c.th===card.th&&c.id!==card.id&&!mismo(c));
 const otros=CARDLIST.filter(c=>c.tipo===card.tipo&&c.id!==card.id&&!mismo(c));
 return mezcla(pool.length>=n?pool:pool.concat(mezcla(otros))).slice(0,n);}
function itemMC(card,dir){
 const d=distractores(card,3),campo=dir==="de2es"?"es":"de";
 return {tipo:"mc",id:card.id,p:dir==="de2es"?card.de:card.es,
  pregunta:dir==="de2es"?"Wie sagt man das auf Spanisch?":"Was heißt das auf Deutsch?",
  o:mezcla([card[campo],...d.map(x=>x[campo])]),c:card[campo],oir:dir==="de2es"?card.es:null};}
function itemEscribir(card){return {tipo:"escribir",id:card.id,p:card.de,pregunta:"Schreib es auf Spanisch",c:card.es};}
function itemHueco(p){
 const frase=p.ej.split("|")[0],pal=frase.split(" ");
 let k=0;pal.forEach((w,i)=>{if(w.replace(/[^\wáéíóúñ]/gi,"").length>pal[k].replace(/[^\wáéíóúñ]/gi,"").length)k=i;});
 const sol=pal[k].replace(/[.,¿?¡!]/g,"");
 const otras=mezcla(PATTERNS.filter(x=>x.id!==p.id).flatMap(x=>x.ej.split("|")[0].split(" ")).filter(w=>w.length>3&&norm(w)!==norm(sol))).slice(0,3);
 return {tipo:"mc",id:"s:"+p.id,p:pal.map((w,i)=>i===k?"_____":w).join(" ")+"  ("+p.ej.split("|")[1]+")",
  pregunta:"Welches Wort fehlt?",o:mezcla([sol,...otras.map(w=>w.replace(/[.,¿?¡!]/g,""))]),c:sol,oir:frase};}
function itemOrden(p){
 const frase=p.ej.split("|")[0];
 return {tipo:"orden",id:"s:"+p.id,p:p.ej.split("|")[1],pregunta:"Bau den spanischen Satz",c:frase,
  fichas:mezcla(frase.split(" ")),oir:frase};}
function itemQuiz(m){return {tipo:"mc",id:null,p:m.q.p,pregunta:"Situation",o:mezcla(m.q.o.slice()),c:m.q.o[m.q.c],expl:m.q.e};}
/* jedes Wort der Mission kommt mindestens einmal dran, jedes zweite ein zweites Mal */
function ejerciciosMision(m){
 const v=mezcla(vocabDeMision(m)),ps=m.pat.map(id=>PATTERNS.find(p=>p.id===id));
 const it=[];
 v.forEach((c,i)=>{const r=i%5;
  it.push(c.rez?itemMC(c,"es2de"):r<2?itemMC(c,"de2es"):r===2?itemMC(c,"es2de"):r===3?itemEscribir(c):itemMC(c,"de2es"));});
 v.filter((c,i)=>i%2===0&&!c.rez).slice(0,6).forEach(c=>it.push(itemEscribir(c)));
 ps.forEach(p=>{it.push(itemHueco(p));it.push(itemOrden(p));});
 return mezcla(it).concat([itemQuiz(m)]);}
function ejerciciosDeCartas(cards){
 return mezcla(cards).slice(0,15).map(c=>{
  if(c.tipo==="bloque"){const p=PATTERNS.find(p=>"s:"+p.id===c.id);return Math.random()<.5?itemHueco(p):itemOrden(p);}
  if(c.rez)return itemMC(c,"es2de");
  const r=Math.random();return r<.5?itemMC(c,"de2es"):r<.8?itemMC(c,"es2de"):itemEscribir(c);});}

/* ---------- Übungs-Sitzung ---------- */
let sess=null;
function empezarSesion(items,ctx,misId){
 if(!items.length){toast("Nichts fällig – gut so.");return;}
 sess={items,i:0,err:0,ctx,misId,estado:null,orden:[]};ir({t:"sesion"});}
function vSesion(){
 if(!sess)return ir({t:"ruta"});
 if(sess.i>=sess.items.length)return finSesion();
 if(sess.pausa===undefined)sess.pausa=Math.ceil(sess.items.length/2);
 if(sess.i===sess.pausa&&!sess.seguida){
  app().innerHTML=`<div class="card" style="text-align:center"><p class="eyebrow">Halbzeit</p>
   <h2>${sess.i} von ${sess.items.length} geschafft</h2>
   <p class="muted small">Gute Stelle für eine Pause. Die zweite Runde dauert noch etwa vier Minuten, deine Antworten sind schon gespeichert.</p></div>
   <button class="btn" id="mas">Zweite Runde</button>
   <button class="btn sec" style="margin-top:10px" id="stop">Für heute reicht es</button>`;
  $("#mas").onclick=()=>{sess.seguida=true;render();};
  $("#stop").onclick=()=>{const g=sess;sess=null;ir({t:"mes",n:(MISSIONS.find(x=>x.id===g.misId)||{m:1}).m});};
  return;}
 const it=sess.items[sess.i];
 const puntos=sess.items.map((_,k)=>`<i class="${k<sess.i?"f":""}"></i>`).join("");
 let campo="";
 if(it.tipo==="mc")campo=it.o.map((o,k)=>`<button class="opt" data-o="${k}">${esc(o)}</button>`).join("");
 else if(it.tipo==="escribir")campo=`<input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Antwort auf Spanisch">${teclado("inp")}<button class="btn" style="margin-top:10px" id="ok">Prüfen</button>`;
 else campo=`<div class="chips" id="constr" aria-label="dein Satz" style="min-height:52px;border:1px dashed var(--linie);border-radius:14px;padding:8px"></div>
  <div class="chips" id="fichas">${it.fichas.map((f,k)=>`<button class="chip" data-f="${k}">${esc(f)}</button>`).join("")}</div>
  <button class="btn" id="ok">Prüfen</button>`;
 app().innerHTML=`<div class="progressdots" role="img" aria-label="Aufgabe ${sess.i+1} von ${sess.items.length}">${puntos}</div>
  <p class="eyebrow">${esc(it.pregunta)}</p><h2 style="font-size:1.35rem;margin-bottom:16px">${esc(it.p)}</h2>
  <div id="campo">${campo}</div><div id="fb"></div>
  <button class="btn sec" style="margin-top:18px" id="salir">Sitzung beenden</button>`;
 $("#salir").onclick=()=>{sess=null;ir({t:"ruta"});};
 if(it.tipo==="mc")app().querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>evaluar(it,it.o[+b.dataset.o],b));
 if(it.tipo==="escribir"){conectaTeclado();$("#inp").focus();$("#ok").onclick=()=>evaluar(it,$("#inp").value);
  $("#inp").onkeydown=e=>{if(e.key==="Enter")evaluar(it,$("#inp").value);};}
 if(it.tipo==="orden"){sess.orden=[];
  const pintar=()=>{$("#constr").innerHTML=sess.orden.map((k,pos)=>`<button class="chip" data-q="${pos}">${esc(it.fichas[k])}</button>`).join("")||`<span class="muted small">Tippe die Wörter in der richtigen Reihenfolge an</span>`;
   app().querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{sess.orden.splice(+b.dataset.q,1);pintar();marcar();});};
  const marcar=()=>app().querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("used",sess.orden.includes(+b.dataset.f)));
  pintar();
  app().querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const k=+b.dataset.f;if(sess.orden.includes(k))return;sess.orden.push(k);pintar();marcar();});
  $("#ok").onclick=()=>evaluar(it,sess.orden.map(k=>it.fichas[k]).join(" "));}
}
function evaluar(it,resp,btn){
 if(sess.estado)return;
 const jui=aceptable(resp,it.c),ok=jui.ok;sess.estado="hecho";
 const d=dia();if(!d.contado){d.contado=true;S.activos=(S.activos||0)+1;}
 d.hecho++;S.stats.total++;if(ok)S.stats.aciertos++;
 if(it.id)responder(it.id,ok);
 if(!ok)sess.err++;
 if(it.tipo==="mc"){app().querySelectorAll(".opt").forEach(b=>{b.disabled=true;
  if(aceptable(b.textContent,it.c).ok)b.classList.add("ok");else if(b===btn)b.classList.add("no");else b.classList.add("dim");});}
 if(ok)chispas();
 if(it.oir&&ok)hablar(it.oir);
 const ANIMO=["Festhalten, das kommt wieder.","Die Karte kommt gleich zurück.","Passiert. Weiter.","Beim nächsten Mal sitzt sie."];
 $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">
   ${ok?"":`<div style="display:flex;gap:10px;margin-bottom:10px">
     <div class="disco grande">${APURO}</div><div class="globo">¡Miau!</div></div>
     <b>Noch nicht</b><br><span class="muted small">${ANIMO[sess.i%4]}</span><br>`}
   ${ok?"<b>Richtig</b><br>":`Richtig ist: <b>${esc(it.c)}</b><br>`}
   ${ok&&jui.gen?`<span class="muted small">Auch die andere Genusform zählt: ${esc(it.c)}.</span><br>`:""}${it.expl?esc(it.expl):""}</div>
  <button class="btn" style="margin-top:12px" id="next">Weiter</button>`;
 toast(ok?(jui.gen?"Richtig, beide Genusformen zählen":"Richtig"):"Falsch. Richtig ist "+it.c);
 $("#next").onclick=()=>{sess.i++;sess.estado=null;render();};
 $("#next").focus();save();}
function finSesion(){
 const n=sess.items.length,err=sess.err,acc=Math.round((n-err)/n*100);
 const ganado=sess.ctx==="mision"?60+Math.max(0,(3-err)*10):10+Math.round(acc/10);
 let extra="";
 if(sess.ctx==="mision"){
  const m=MISSIONS.find(x=>x.id===sess.misId);
  const e=err<=1?3:err<=3?2:1,prev=S.done[m.id]?.e||0;
  S.done[m.id]={e:Math.max(e,prev),ts:ahora()};delete S.prog[m.id];
  activar(cardsDeMision(m).map(c=>c.id));
  darXP(ganado);
  const mes=MESES.find(x=>x.n===m.m);
  extra=`<div class="card" style="text-align:center"><div class="disco" style="color:${COL[mes.a]};margin:0 auto 8px">${ANIM[mes.a]}</div>
   <p class="eyebrow">${esc(mes.r)}</p><h2>Mission geschafft</h2>
   <div class="stbar" style="justify-content:center;margin:10px 0">${[0,1,2].map(i=>`<i class="${i<e?"f":""}"></i>`).join("")}</div>
   <p class="muted small">Die neuen Wörter und Satzbausteine liegen jetzt im Übemodus und kommen in wachsenden Abständen zurück.</p>
   <p class="small" style="margin:10px 0 0">Zu dieser Mission gibt es eine Sprechkarte im Bereich <b>Sprechen</b> – für zu Hause, nicht für die Bahn.</p></div>`;
  fiesta();
 }else{darXP(ganado);}
 save();
 if(err===0){S.stats.perfectas=(S.stats.perfectas||0)+1;}
 const nivelR=acc>=90?["¡Perfecto!","Das saß."]:acc>=70?["¡Muy bien!","Gute Runde."]:acc>=40?["¡Bien hecho!","Weiter so."]:["¡Sigue!","Mit Wiederholung wird das."];
 revisaLogros();
 app().innerHTML=extra+`<div class="card" style="text-align:center">
  <p class="eyebrow">${esc(nivelR[0])}</p>
  <div class="cifra" style="font-size:3rem">+${ganado}<span style="font-size:1.2rem;color:var(--crema2)"> XP</span></div>
  <p class="muted small" style="margin:6px 0 16px">${esc(nivelR[1])} Gesamt: ${S.xp} XP</p>
  <div class="row" style="gap:8px">
   <div class="kachel"><b>${n-err}/${n}</b><span class="rotulo">richtig</span></div>
   <div class="kachel"><b>${acc}%</b><span class="rotulo">Genauigkeit</span></div>
   <div class="kachel"><b>${Math.min(dia().hecho,dia().meta)}/${dia().meta}</b><span class="rotulo">Tagesziel</span></div></div>
  ${err?`<p class="muted small" style="margin:14px 0 0">${err} ${err===1?"Karte kommt":"Karten kommen"} früher zurück in die Wiederholung.</p>`:""}</div>
  <div class="row"><button class="btn" id="a">Zur Reise</button><button class="btn sec" id="b">Weiter üben</button></div>`;
 $("#a").onclick=()=>{sess=null;ir({t:"ruta"});};
 $("#b").onclick=()=>{sess=null;ir({t:"practicar"});};}

   :`<p class="muted small">Noch nichts freigespielt. Starte die erste Mission in der Reise.</p>`}</div>
 <div class="card"><p class="eyebrow">Grammatik</p>
  ${GRAMMAR.map(g=>`<button class="opt" data-gram="${g.id}" style="margin-bottom:8px"><b>${esc(g.t)}</b> <span class="pill g">${esc(g.ref)}</span><br><span class="muted small">${esc(g.k)}</span></button>`).join("")}</div>`;
 $("#dia").onclick=()=>empezarSesion(ejerciciosDeCartas(due),"repaso");
 if($("#nuevas"))$("#nuevas").onclick=()=>{const nv=cartasNuevas().slice(0,restanHoy());
  if(!nv.length)return;activar(nv.map(c=>c.id));dia().nuevas=(dia().nuevas||0)+nv.length;save();
  empezarSesion(ejerciciosDeCartas(nv),"repaso");};
 app().querySelectorAll("[data-tema]").forEach(b=>b.onclick=()=>{
  const cs=CARDLIST.filter(c=>c.th===b.dataset.tema&&S.srs[c.id]);empezarSesion(ejerciciosDeCartas(cs).slice(0,12),"repaso");});
 app().querySelectorAll("[data-gram]").forEach(b=>b.onclick=()=>{

  if(!ps.length){toast("Für dieses Thema gibt es Beispiele im Nachschlagen.");return ir({t:"buscar",tab:"gram",q:b.dataset.gram});}
  empezarSesion(mezcla(ps).flatMap(p=>[itemHueco(p),itemOrden(p)]).slice(0,10),"repaso");});}

 const tab=vista.tab||"temas",q=vista.q||"";
 const nq=norm(q);
 const filtra=arr=>!nq?arr:arr.filter(x=>norm(JSON.stringify(x)).includes(nq));

 }
 app().innerHTML=`<h1>Nachschlagen</h1>

 const total=CARDLIST.length,act=Object.keys(S.srs).length;

 const est=Object.values(S.done).reduce((a,d)=>a+d.e,0);

  <table><tbody>
  <tr><td>Rang</td><td>${esc(tituloNivel())} (Stufe ${nivel()} von 6)</td></tr>
  <tr><td>Missionen</td><td>${Object.keys(S.done).length} von ${MISSIONS.length} · ${est} Sterne</td></tr>\n  <tr><td>Sprechkarten</td><td>${Object.keys(S.habla||{}).length} von ${MISSIONS.length} gemacht</td></tr>
  <tr><td>Karten im Umlauf</td><td>${act} von ${total}</td></tr>
  <tr><td>Sitzt sicher</td><td>${seguras} Karten</td></tr>
  <tr><td>Lernwoche</td><td>${semanaActual()} von 52 · ${S.activos||0} gelernte Tage</td></tr>
  <tr><td>Puffer</td><td>${retraso()?`${retraso()} von ${PUFFER} Tagen genutzt`:"unangetastet"}</td></tr>\n  <tr><td>Bis Madrid</td><td>${diasHasta(MUDANZA)} Tage (August 2027)</td></tr>\n  <tr><td>Wortschatz</td><td>${CARDLIST.filter(c=>c.tipo==="palabra").length} Lexeme, davon ${CARDLIST.filter(c=>c.niv==="B1").length} auf B1</td></tr>
  <tr><td>Bausteine</td><td>${PATTERNS.filter(p=>p.tipo==="chunk").length} Chunks, ${PATTERNS.filter(p=>p.tipo==="scaffold").length} Scaffolds</td></tr>
  <tr><td>Phase</td><td>${esc(NOMBRE_FASE[MESES[Math.min(11,regionRecomendada()-1)].fase])}</td></tr></tbody></table></div>
 <div class="card"><p class="eyebrow">Erfolge</p>
  <h3 style="margin-bottom:10px">${(S.logros||[]).length} von ${LOGROS.length}</h3>
  <div class="logros">${LOGROS.map(b=>{const ok=(S.logros||[]).includes(b.id);
   return `<div class="logro ${ok?"":"off"}"><span style="color:${ok?b.col:"var(--crema2)"};display:block">${ICO[b.ic]}</span><span>${esc(b.nm)}</span></div>`;}).join("")}</div></div>
 <div class="card"><p class="eyebrow">Begleiter</p>
  <div style="display:flex;gap:16px;flex-wrap:wrap">${["gata","conejo","buho","zorro"].map(a=>
   `<div style="text-align:center;opacity:${animales.includes(a)?1:.3}"><div class="disco" style="color:${COL[a]}">${ANIM[a]}</div>
    <span class="small muted">${a==="gata"?"Mira":a==="conejo"?"Bruno":a==="buho"?"Nube":"Rita"}</span></div>`).join("")}</div>
  <p class="muted small" style="margin:10px 0 0">Jede neue Region weckt einen Begleiter.</p>
  <p class="eyebrow" style="margin-top:16px">Nube: drei Entwürfe</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap">${["a","b","c"].map(k=>
   `<button data-buho="${k}" style="flex:1 1 84px;text-align:center;padding:8px;border-radius:14px;border:2px solid ${S.set.buho===k?"var(--farol)":"var(--linie)"}">
     <div class="disco" style="color:var(--cielo);margin:0 auto">${BUHOS[k]}</div>
     <span class="small muted" style="display:block;margin-top:6px">${esc(NOMBRE_BUHO[k])}</span></button>`).join("")}</div>
  <p class="muted small" style="margin:8px 0 0">Nube begleitet die Regionen 4, 6 und 9.</p>
  <button class="btn sec" style="margin-top:12px" id="gal">Kartenraum: alle zwölf Szenen ansehen</button></div>
 <div class="card"><p class="eyebrow">Einstellungen</p>
  <button class="opt" id="tde">Deutsche Übersetzung im Dialog: <b>${S.set.de?"an":"aus"}</b></button>
  <button class="opt" id="tvoz">Aussprache vorlesen: <b>${S.set.voz?"an":"aus"}</b></button>
  <button class="opt" id="tmeta">Tagesziel: <b>${dia().meta} Aufgaben</b> <span class="muted small">tippen zum Wechseln</span></button>
  <button class="opt" id="tfondo">Hintergrundbilder: <b>${S.set.fondo==="dibujo"?"gezeichnete Szenen":"Fotos"}</b></button>
  <button class="opt" id="ttest">Testmodus, alle Regionen offen: <b>${S.set.test?"an":"aus"}</b></button>
  <p class="muted small">Zum Anschauen und Prüfen gedacht. Im Alltag aus lassen – sonst fällt die Zeitsteuerung weg, die dich über das Jahr trägt.</p>
  <p class="muted small">${hayVoz()?"Eine spanische Stimme ist auf diesem Gerät verfügbar.":"Auf diesem Gerät wurde keine spanische Stimme gefunden. Die App funktioniert ohne Ton vollständig."}</p></div>
 <div class="card"><p class="eyebrow">Daten</p>
  <p class="muted small">Alles bleibt in diesem Browser. Kein Server, keine Konten, keine Tracker. Für ein zweites Gerät den Text kopieren.</p>
  <div class="row" style="margin-bottom:10px">
   <button class="btn" id="baja">Lernstand als Datei speichern</button>
   <button class="btn sec" id="sube">Datei laden</button></div>
  <input type="file" id="arch" accept="application/json,.json" style="display:none" aria-label="Sicherungsdatei auswählen">
  <details><summary class="small muted" style="cursor:pointer;padding:6px 0">Sicherungstext zum Kopieren anzeigen</summary>
   <textarea id="dump" readonly aria-label="Sicherungskopie">${esc(JSON.stringify(S))}</textarea></details>
  <p class="small ${copiaVieja()?"":"muted"}" style="${copiaVieja()?"color:var(--farol)":""}">${S.copia?`Zuletzt gesichert: ${new Date(S.copia).toLocaleDateString("de-DE")}`:"Noch nie gesichert."} Text markieren, kopieren, an dich selbst schicken.</p>
  <button class="btn sec" style="margin-top:8px" id="hecha">Sicherung erledigt</button>
  <div class="row" style="margin-top:10px"><button class="btn sec" id="imp">Sicherung einspielen</button><button class="btn sec" id="res">Alles zurücksetzen</button></div></div>`;
 $("#tde").onclick=()=>{S.set.de=!S.set.de;save();render();};
 $("#tvoz").onclick=()=>{S.set.voz=!S.set.voz;save();if(S.set.voz)hablar("Hola, buenos días");render();};
 $("#gal").onclick=()=>ir({t:"galeria"});
 app().querySelectorAll("[data-buho]").forEach(b=>b.onclick=()=>{S.set.buho=b.dataset.buho;save();render();});
 $("#ttest").onclick=()=>{S.set.test=!S.set.test;save();render();};
 $("#tmeta").onclick=()=>{const m=[8,12,16,20];S.dia.meta=m[(m.indexOf(dia().meta)+1)%m.length];save();render();};
 $("#tfondo").onclick=()=>{S.set.fondo=S.set.fondo==="dibujo"?"foto":"dibujo";save();render();};
 $("#hecha").onclick=()=>{S.copia=ahora();save();toast("Sicherung notiert");render();};
 $("#baja").onclick=()=>{try{
  const nombre="mondtal-"+hoy()+".json";
  const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
  S.copia=ahora();save();toast("Datei "+nombre+" gespeichert");render();
 }catch(e){toast("Speichern nicht möglich");alert("Der Browser hat den Download blockiert. Nutze den Sicherungstext weiter unten.");}};
 $("#sube").onclick=()=>$("#arch").click();
 $("#arch").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  const lector=new FileReader();
  lector.onload=()=>{try{const o=JSON.parse(lector.result);
   if(!o||typeof o!=="object"||!("xp" in o))throw new Error("Format");
   if(!confirm("Lernstand aus der Datei übernehmen? Der aktuelle Stand in diesem Browser wird ersetzt."))return;
   localStorage.setItem(KEY,JSON.stringify(o));S=load();toast("Lernstand geladen");render();
  }catch(err){alert("Diese Datei ließ sich nicht lesen. Erwartet wird eine mit dieser App gespeicherte JSON-Datei.");}};
  lector.readAsText(f);};
 $("#imp").onclick=()=>{const t=prompt("Sicherungstext einfügen:");if(!t)return;
  try{const o=JSON.parse(t);S=Object.assign({},DEF,o);save();toast("Sicherung eingespielt");render();}catch(e){toast("Text nicht lesbar");alert("Der Text ließ sich nicht lesen. Bitte den gesamten Sicherungstext einfügen.");}};
 $("#res").onclick=()=>{if(confirm("Wirklich alles löschen? Fortschritt, Karten und Sterne sind dann weg."))
  {S=JSON.parse(JSON.stringify(DEF));S.inicio=hoy();save();render();}};}

/* ---------- Serviceworker: nur auf einem Server, nicht beim Doppelklick ---------- */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
 addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}

/* ---------- Start ---------- */
cielo();
if(!S.inicio){S.inicio=hoy();save();}
render();
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
</script>
</body>
</html>
